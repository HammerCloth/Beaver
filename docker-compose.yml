# 显式网络，避免 Caddy 内解析不到服务名 backend（127.0.0.11 DNS）
networks:
  app:
    driver: bridge

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: beaver-backend
    networks:
      - app
    environment:
      APP_ENV: production
      APP_PORT: "8080"
      DATABASE_PATH: /data/zero.db
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change-this-access-secret}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-this-refresh-secret}
    volumes:
      - zero_data:/data
    restart: unless-stopped

  caddy:
    image: caddy:2.8-alpine
    container_name: beaver-caddy
    depends_on:
      - backend
    networks:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      CADDY_SITE: ${CADDY_SITE:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./frontend-vue/dist:/srv/frontend:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  # 卷名沿用改名前的 zero_data：改名会挂上一个新的空卷，导致现有数据库“消失”
  zero_data:
  caddy_data:
  caddy_config:
