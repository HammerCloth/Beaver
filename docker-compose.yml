# 显式网络，避免 Caddy 内解析不到服务名 backend（127.0.0.11 DNS）
networks:
  app:
    driver: bridge

services:
  # 镜像由 CI 构建并发布到 GHCR；BEAVER_VERSION 可指定某次提交的 sha，默认 latest。
  # 想从源码构建：docker compose build（或 BUILD_FROM_SOURCE=1 ./scripts/deploy.sh）
  backend:
    image: ${BEAVER_IMAGE:-ghcr.io/hammercloth/beaver}-backend:${BEAVER_VERSION:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: beaver-backend
    networks:
      - app
    environment:
      APP_ENV: production
      APP_PORT: "8080"
      DATABASE_PATH: /data/zero.db
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:8080}
      # 不提供默认值：公开的默认密钥等于任何人都能伪造登录令牌。未配置时 compose 直接报错
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?请在 .env 中设置 JWT_ACCESS_SECRET（例如 openssl rand -base64 48）}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?请在 .env 中设置 JWT_REFRESH_SECRET（例如 openssl rand -base64 48）}
    volumes:
      - zero_data:/data
    restart: unless-stopped

  # 发前端静态文件并把接口转给后端，不处理域名和 HTTPS。前端和 Caddyfile 已打进镜像
  caddy:
    image: ${BEAVER_IMAGE:-ghcr.io/hammercloth/beaver}-web:${BEAVER_VERSION:-latest}
    build:
      context: .
      dockerfile: web.Dockerfile
    container_name: beaver-caddy
    depends_on:
      - backend
    networks:
      - app
    # 默认只对本机开放；要用域名和 HTTPS，在前面放一个反向代理指向这个端口（见 docs/DEPLOYMENT.md）。
    # 局域网内直接访问可设 BEAVER_BIND=0.0.0.0
    ports:
      - "${BEAVER_BIND:-127.0.0.1}:${BEAVER_PORT:-8080}:80"
    restart: unless-stopped

volumes:
  # 卷名沿用改名前的 zero_data：改名会挂上一个新的空卷，导致现有数据库“消失”
  zero_data:
